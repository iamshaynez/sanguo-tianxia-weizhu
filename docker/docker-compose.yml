# gb-test 服务器 /opt/apps/sanguo/docker-compose.yml 的版本化副本——改动两处同步。
# 服务器布局：/opt/apps/sanguo/{docker-compose.yml, build.sh, deploy.sh, .env}
# 镜像来自阿里云 ACR（与 app41 / novel-universe 同实例，命名空间 xiaowenz）。
# 接入层：openresty 反代 san.xiaowenz.com → 容器名 sanguo:80，经共享 apps 网络
# （本文件底部 networks 段完成接入）。域名走 CF proxy：CF 接管面向浏览器的 TLS、
# Flexible 模式回源走源站 80——源站不配 443/证书；若将来切 Full(strict)，
# 用 CF Origin Certificate（免费 15 年），不要在源站自行签证书。
# 本机 18091 端口保留作运维/冒烟后门（deploy.sh 冒烟即打它）。
services:
  sanguo:
    image: ${ACR_REGISTRY}/xiaowenz/sanguo-tianxia-weizhu:main
    container_name: sanguo
    init: true
    restart: unless-stopped
    ports:
      - "127.0.0.1:18091:80"   # 只绑回环：对外一律走 openresty/CF，不直接暴露公网
    healthcheck:
      # 纯静态直出：/ 能应答即等价健康
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:80/runtime.json"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

# 接入层：与 openresty（1Panel）共享 apps 网络，nginx 以容器名反代
networks:
  default:
    name: apps
    external: true

# 纯静态直出：无路由、无反代，唯一动作是开 gzip 压文本资产
# （27MB 立绘 PNG 交给 CF 边缘缓存，源站不做图片压缩）。
# 缓存策略（无哈希文件名的静态站靠响应头保证"部署即生效"）：
#   HTML/runtime.json → no-store：外壳与版本探针永远拿最新；
#   src/、style.css   → no-cache：可缓存但必须带 ETag 再验证（304 便宜），
#                        浏览器与 CF 边缘都不会在部署后继续供旧代码；
#   assets/           → immutable 一年：文件名即版本（头像编号法则），
#                        内容永不变更，放心交给浏览器与 CF 长缓存。
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    location = / { add_header Cache-Control "no-store"; }
    location = /index.html { add_header Cache-Control "no-store"; }
    location = /runtime.json { add_header Cache-Control "no-store"; }
    location /src/ { add_header Cache-Control "no-cache"; }
    location = /style.css { add_header Cache-Control "no-cache"; }
    location /assets/ { add_header Cache-Control "public, max-age=31536000, immutable"; }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}

# 纯静态直出：无路由、无反代，唯一动作是开 gzip 压文本资产
# （27MB 立绘 PNG 交给 CF 边缘缓存，源站不做图片压缩）。
# 缓存策略（无哈希文件名的静态站靠响应头保证"部署即生效"）：
#   HTML / runtime.json / src/ / style.css → no-store：
#     代码与外壳永远拿最新。原用 no-cache(ETag 再验证)即可达标,但该站
#     CF zone 的 Browser Cache TTL 会把 no-cache 改写成 ~186 天 max-age,
#     而 no-store 实测被 CF 原样放行(DYNAMIC)——故统一 no-store。
#     JS 总量 gzip 后数百 KB,不做 304 的代价可忽略。
#   assets/ → immutable 一年：文件名即版本（头像编号法则），
#     内容永不变更，放心交给浏览器与 CF 长缓存。
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    location = / { add_header Cache-Control "no-store"; }
    location = /index.html { add_header Cache-Control "no-store"; }
    location = /runtime.json { add_header Cache-Control "no-store"; }
    # /v2/src/:部署命名空间,由 entrypoint 在容器启动时把入口脚本改写过来。
    # 缘由:CF 边缘在 no-cache 时代缓存过 /src/* 旧对象(浏览器 TTL ~186 天),
    # 源站改 no-store 只影响新请求,旧 HIT 对象在 TTL/手动清除前会继续供旧代码;
    # 换命名空间让所有模块 URL 一次性变成从未缓存的新 URL,旧对象自然废弃。
    # 下次如再遇同类缓存困境,把 entrypoint 里的版本号 +1 即可(v2→v3)。
    location /v2/src/ { alias /usr/share/nginx/html/src/; add_header Cache-Control "no-store"; }
    location /src/ { add_header Cache-Control "no-store"; }
    location = /style.css { add_header Cache-Control "no-store"; }
    location /assets/ { add_header Cache-Control "public, max-age=31536000, immutable"; }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
